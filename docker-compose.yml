# Web UI only (existing database):   docker compose up -d
# Web UI + bundled PostgreSQL:       docker compose --profile db up -d
# Works with Docker Desktop (Windows/macOS), Docker Engine and Podman (podman compose).

services:
  web:
    image: ghcr.io/jcombs-pointblue/dirxmleventlogger-web:latest
    build: ./web
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-idmEvent}
      DB_USER: ${DB_USER:-eventlogger_reader}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TABLE_NAME: ${TABLE_NAME:-public.dxmlevent}
    restart: unless-stopped

  postgres:
    image: postgres:17
    profiles: ["db"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-idmEvent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      READER_USER: ${DB_USER:-eventlogger_reader}
      READER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WRITER_USER: ${WRITER_USER:-eventlogger_writer}
      WRITER_PASSWORD: ${WRITER_PASSWORD:?Set WRITER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "./sql/CREATE jsonEvent.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"
      - ./docker/postgres-init/02-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
