name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # No engine jars in CI: the build compiles against idm-api-stubs.
      - name: Build and test
        env:
          EVENTLOGGER_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
          EVENTLOGGER_TEST_USER: postgres
          EVENTLOGGER_TEST_PASSWORD: postgres
        run: mvn -B package
      - name: Check no engine classes are packaged
        run: |
          if unzip -l target/dirxml-event-logger-*.jar | grep -q 'com/novell/'; then
            echo "::error::Engine API classes found in the jar"; exit 1
          fi
